# Throwaway local stack for the frontend's `npm run audit:full`. All secrets are
# disposable local values; never reuse them anywhere real. See docs/LOCAL-AUDIT-STACK.md.
name: bookclub-audit

x-jwt-secret: &jwt_secret audit-local-jwt-secret-0123456789abcdef0123456789

services:
  db:
    image: postgres:16
    # app/database.py hardcodes ssl=require (no CA verification), so Postgres needs TLS with a self-signed cert.
    command:
      - sh
      - -c
      - >-
        openssl req -new -x509 -nodes -days 30 -subj /CN=db -keyout /tmp/s.key -out /tmp/s.crt &&
        chown postgres /tmp/s.key /tmp/s.crt && chmod 600 /tmp/s.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/s.crt -c ssl_key_file=/tmp/s.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: audit-pg-password
      POSTGRES_DB: bookclub
    volumes:
      - ./docker/audit/initdb.sh:/docker-entrypoint-initdb.d/10-gotrue.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookclub && psql -U postgres -d gotrue -c 'select 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  gotrue:
    image: supabase/gotrue:v2.188.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9998
      GOTRUE_SITE_URL: http://localhost:3200
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:audit-pg-password@db:5432/gotrue?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: *jwt_secret
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "1000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  supabase-proxy:
    image: nginx:1.27-alpine
    depends_on:
      gotrue:
        condition: service_healthy
    volumes:
      - ./docker/audit/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9998:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      supabase-proxy:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:audit-pg-password@db:5432/bookclub
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://supabase-proxy
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDB9.o6vkHGKVnwnwxwQ7wUwYafohpS82e8elW6VU0Po1_KI
      SUPABASE_JWT_SECRET: *jwt_secret
      ALLOWED_ORIGINS: '["http://localhost:4200","http://localhost:3000","http://localhost:3200","http://127.0.0.1:3200"]'
      FRONTEND_URL: http://localhost:3200
      BACKEND_URL: http://localhost:${AUDIT_API_PORT:-8000}
      RUN_BACKGROUND_TASKS: "false"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${AUDIT_API_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

volumes:
  pgdata:
