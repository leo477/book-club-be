services:
  - type: web
    name: book-club-be
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET # optional, legacy HS256 only
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MAPS_API_KEY
        sync: false
      - key: MAPS_SERVER_API_KEY
        sync: false
      - key: WEB_REVALIDATE_URL
        sync: false
      - key: WEB_REVALIDATE_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://book-club-be.onrender.com
      - key: FRONTEND_URL
        value: https://book-club-planer.vercel.app

# The "keep-alive" cron service is managed manually in the Render dashboard,
# not via this Blueprint: Render requires a paid plan for Blueprint-managed
# cron services, and this one runs fine on the free plan when created
# directly in the UI.

previews:
  generation: off
