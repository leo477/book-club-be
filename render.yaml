services:
  - type: web
    name: book-club-be
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: cron
    name: keep-alive
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    schedule: "*/10 * * * *"
    startCommand: "curl -sf https://book-club-be.onrender.com/health || true"

previews:
  generation: off
