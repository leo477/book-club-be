services:
  - type: web
    name: book-club-be
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars: []

  - type: cron
    name: keep-alive
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    schedule: "*/10 * * * *"
    startCommand: "curl -sf https://book-club-be.onrender.com/health || true"

previews:
  generation: off
