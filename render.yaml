# Blueprint for the production service. sync:false values are asked for only
# at initial Blueprint creation and are otherwise managed in the dashboard.
# See docs/RENDER-DEPLOY.md.
services:
  - type: web
    name: book-club-be
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt # immutable after creation; matches the live service
    numInstances: 1
    branch: main
    # Render never deploys on its own. The deploy-render job in
    # .github/workflows/ci-cd.yml creates the deploy through the Render API
    # after all checks pass and waits for it. Replaces the deprecated
    # autoDeploy flag.
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # sync:false (not generateValue): the live secret must never be
      # regenerated, as that would invalidate every issued token.
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET # optional, legacy HS256 only
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # optional; cover upload fails with 502 without it
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MAPS_API_KEY
        sync: false
      - key: MAPS_SERVER_API_KEY
        sync: false
      - key: WEB_REVALIDATE_URL
        sync: false
      - key: WEB_REVALIDATE_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://book-club-be.onrender.com
      - key: FRONTEND_URL
        value: https://book-club-planer.vercel.app

# The "keep-alive" cron service is managed manually in the Render dashboard,
# not via this Blueprint: Render requires a paid plan for Blueprint-managed
# cron services, and this one runs fine on the free plan when created
# directly in the UI.

previews:
  generation: off
