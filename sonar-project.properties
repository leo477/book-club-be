sonar.projectKey=leo477_book-club-be
sonar.organization=leo477

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Coverage report from pytest-cov --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Exclude infrastructure files from analysis
sonar.exclusions=alembic/**
sonar.coverage.exclusions=app/main.py,app/routers/health.py,app/routers/chat.py

# Exclude routers from CPD (duplicate detection) — FastAPI Annotated dependency
# injection pattern is intentionally repetitive boilerplate across router files
sonar.cpd.exclusions=app/routers/**

# Source encoding
sonar.sourceEncoding=UTF-8

# bc_session marker cookie is deliberately non-httpOnly (JS-readable via
# document.cookie); S3330 can't distinguish that from an oversight.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3330
sonar.issue.ignore.multicriteria.e1.resourceKey=app/routers/auth.py
