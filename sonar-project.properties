sonar.projectKey=leo477_book-club-be
sonar.organization=leo477

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Coverage report from pytest-cov --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
# same files as [tool.coverage.run] omit in pyproject.toml: they are not in coverage.xml, so Sonar must not count them as uncovered
sonar.coverage.exclusions=app/main.py,app/routers/health.py

# Source encoding
sonar.sourceEncoding=UTF-8
