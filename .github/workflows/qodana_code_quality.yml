#-------------------------------------------------------------------------------#
#            Discover all capabilities of Qodana in our documentation           #
#             https://www.jetbrains.com/help/qodana/about-qodana.html           #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: 'Qodana Scan'
        id: qodana
        uses: JetBrains/qodana-action@89eb4357efd2b52e639f3216e63edaf33b82622b # v2025.3.2
        continue-on-error: true
        with:
          args: --image jetbrains/qodana-python:2025.3
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          cache-default-branch-only: false
          post-pr-comment: true
          use-annotations: true
          upload-result: ${{ secrets.QODANA_TOKEN != '' }}
          push-fixes: 'none'
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      - name: 'Upload SARIF to GitHub Security tab'
        uses: github/codeql-action/upload-sarif@45775bd8235c68ba998cffa5171334d58593da47 # v3
        # Only upload when the scan actually produced a SARIF report. The Qodana
        # step is continue-on-error, so a failed scan (e.g. declined license
        # token) would otherwise leave the job red on a missing file.
        if: always() && github.event_name == 'push' && hashFiles(format('{0}/qodana/results/qodana.sarif.json', runner.temp)) != ''
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

      - name: 'Fail when the scan did not complete'
        # Distinguish a genuine infrastructure/license failure from a quality-gate
        # finding: a failed scan that still produced a SARIF means Qodana ran and
        # found problems (kept non-blocking), while a failed scan with NO report
        # means the scan never ran (e.g. an invalid/declined QODANA_TOKEN) — that
        # must turn the job red instead of silently passing.
        if: always() && github.event_name == 'push' && steps.qodana.outcome == 'failure' && hashFiles(format('{0}/qodana/results/qodana.sarif.json', runner.temp)) == ''
        run: |
          echo "::error::Qodana scan did not produce a report — likely an invalid or declined QODANA_TOKEN, or an infrastructure error. Check the 'Qodana Scan' step logs."
          exit 1