name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy app/
      - name: Bandit security lint
        run: uv run bandit -r app/ -ll -x app/routers/health.py

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookclub_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run pytest with coverage
        run: uv run pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bookclub_test
          SECRET_KEY: test-secret
          ENV: test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6 # v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-club-be
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}

  trivy-scan:
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Trivy scan (table output for logs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.30.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/book-club-be:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.30.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/book-club-be:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload Trivy scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
      - name: Fail on CRITICAL vulnerabilities (fixed, not yet uploaded to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.30.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/book-club-be:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  deploy-render:
    needs: trivy-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const d = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Render deployment',
            });
            core.setOutput('deployment_id', d.data.id);
      # Render does not auto-deploy (autoDeployTrigger: "off" in render.yaml),
      # so there is no checksPass deadlock: this job creates the deploy through
      # the Render API and waits for it. /health is not used because the
      # previous instance keeps answering 200 while a new build fails.
      - name: Mark deployment as in progress
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Deploying to Render',
            });
      - name: Deploy to Render and wait
        id: render
        timeout-minutes: 14
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d7d6q2t8nd3s73dp6bhg
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          rcurl() {
            curl -sS -f --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" "$@"
          }
          fail() {
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          find_deploy() {
            rcurl "${api}?limit=20" | jq -r --arg sha "$COMMIT_SHA" \
              '[.[] | (.deploy // .) | select(.commit.id == $sha)] | first | .id // empty'
          }
          deploy_id=$(find_deploy) || fail "Could not list Render deploys"
          if [ -n "$deploy_id" ]; then
            echo "Render deploy $deploy_id already exists for ${COMMIT_SHA:0:7}; reusing it"
          else
            echo "Creating Render deploy for ${COMMIT_SHA:0:7}"
            # Single attempt, no retry: a retried POST could create two deploys.
            resp=$(curl -sS -f --connect-timeout 10 --max-time 60 -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg sha "$COMMIT_SHA" '{clearCache: "do_not_clear", commitId: $sha}')" \
              "$api") || resp=""
            deploy_id=$(printf '%s' "$resp" | jq -r '(.deploy // .) | .id // empty' 2>/dev/null || true)
            if [ -z "$deploy_id" ]; then
              # Response lost or empty (e.g. 202): look the deploy up by sha instead of POSTing again.
              for _ in 1 2 3 4 5 6; do
                sleep 10
                deploy_id=$(find_deploy) || deploy_id=""
                [ -n "$deploy_id" ] && break
              done
            fi
            [ -n "$deploy_id" ] || fail "Render did not create a deploy for ${COMMIT_SHA:0:7}"
          fi
          echo "Render deploy id: $deploy_id"
          deadline=$((SECONDS + 780))
          last=""
          while :; do
            status=$(rcurl "${api}/${deploy_id}" | jq -r '(.deploy // .) | .status // "unknown"') || status="unknown"
            if [ "$status" != "$last" ]; then echo "Render deploy status: $status"; last="$status"; fi
            case "$status" in
              live)
                echo "state=success" >> "$GITHUB_OUTPUT"
                echo "description=Deployed to Render" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled)
                fail "Render deploy ended as $status" ;;
              deactivated)
                fail "Render deploy was deactivated before going live (superseded or cancelled)" ;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || fail "Render deploy not live after 13 minutes (last status '$status')"
            sleep 15
          done
      # Single place that sets the final status, so it is never set twice. If
      # the deploy step died without reporting (step timeout, runner error) the
      # state defaults to failure.
      - name: Report final deployment status
        if: ${{ always() && !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          DEPLOY_STATE: ${{ steps.render.outputs.state }}
          DEPLOY_DESCRIPTION: ${{ steps.render.outputs.description }}
        with:
          script: |
            const ok = process.env.DEPLOY_STATE === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: ok ? 'success' : 'failure',
              environment_url: '${{ secrets.RENDER_APP_URL }}',
              description: process.env.DEPLOY_DESCRIPTION || 'Render deploy did not complete',
            });
